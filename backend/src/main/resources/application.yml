spring:
  application:
    name: aslan
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aslan}
    username: ${SPRING_DATASOURCE_USERNAME:aslan}
    password: ${SPRING_DATASOURCE_PASSWORD:aslan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

aslan:
  cors:
    origenes: ${ASLAN_CORS_ORIGENES:http://localhost:8443,http://localhost:5173}
